<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="stylesheet" href="TemplateData/style.css" />

  <!-- Yandex.Metrica -->
  <script type="text/javascript">
    (function (m, e, t, r, i, k, a) {
      m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
      m[i].l = 1 * new Date();
      k = e.createElement(t), a = e.getElementsByTagName(t)[0], k.async = 1, k.src = r, a.parentNode.insertBefore(k, a);
    })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

    const yandexMetricaId = "YANDEX_METRICA_ID";
    if (yandexMetricaId && yandexMetricaId !== "YANDEX_METRICA_ID") {
      ym(yandexMetricaId, "init", {
        clickmap: true,
        trackLinks: true,
        accurateTrackBounce: true
      });
    }
  </script>
  <noscript>
    <div>
      <img src="https://mc.yandex.ru/watch/YANDEX_METRICA_ID" style="position:absolute; left:-9999px;" alt="" />
    </div>
  </noscript>
  <!-- /Yandex.Metrica -->

  <!-- Yandex Games SDK -->
  <script src="https://yandex.ru/games/sdk/v2"></script>
  <!-- /Yandex Games SDK -->

  <!-- Yandex Ads -->
  <script src="https://yandex.ru/ads/system/context.js" async></script>
  <!-- /Yandex Ads -->

  <script>
    window.yaContextCb = window.yaContextCb || [];
    window.ysdk = null;

    YaGames.init().then((sdk) => {
      window.ysdk = sdk;
    }).catch((e) => {
      console.warn("Yandex Games SDK init failed", e);
    });

    function showYandexGamesFullscreen(placement) {
      if (!window.ysdk || !window.ysdk.adv || !window.ysdk.adv.showFullscreenAdv) {
        return false;
      }

      window.ysdk.adv.showFullscreenAdv({
        callbacks: {
          onClose: () => console.log("Yandex Games Ads closed", placement),
          onError: (e) => console.warn("Yandex Games Ads error", placement, e)
        }
      });
      return true;
    }

    function showYandexContextFullscreen(placement) {
      const blockId = "YANDEX_ADS_FULLSCREEN_BLOCK_ID";
      if (blockId === "YANDEX_ADS_FULLSCREEN_BLOCK_ID") {
        return false;
      }

      window.yaContextCb.push(() => {
        if (!window.Ya || !Ya.Context || !Ya.Context.AdvManager || !Ya.Context.AdvManager.showFullscreenAdv) {
          console.warn("Yandex Ads: fullscreen not available");
          return;
        }

        Ya.Context.AdvManager.showFullscreenAdv({
          blockId,
          callbacks: {
            onClose: () => console.log("Yandex Ads closed", placement),
            onError: (e) => console.warn("Yandex Ads error", placement, e)
          }
        });
      });
      return true;
    }

    window.Yandex_ShowFullscreenAd = function (placement) {
      if (showYandexGamesFullscreen(placement)) {
        return;
      }

      if (showYandexContextFullscreen(placement)) {
        return;
      }

      console.warn("Yandex Ads: fullscreen not configured", placement);
    };

  </script>
</head>
<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <!-- Yandex Ads container -->
  <div id="yandex_rtb" class="yandex-ads"></div>
  <script>
    const yandexAdsBlockId = "YANDEX_ADS_BLOCK_ID";
    if (yandexAdsBlockId && yandexAdsBlockId !== "YANDEX_ADS_BLOCK_ID") {
      window.yaContextCb.push(() => {
        Ya.Context.AdvManager.render({
          renderTo: "yandex_rtb",
          blockId: yandexAdsBlockId
        });
      });
    }
  </script>
  <!-- /Yandex Ads container -->

  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const loadingBar = document.querySelector("#unity-loading-bar");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");

    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}"
    }, (progress) => {
      if (progressBarFull) {
        progressBarFull.style.width = (100 * progress) + "%";
      }
    }).then(() => {
      if (loadingBar) {
        loadingBar.style.display = "none";
      }
    });
  </script>
</body>
</html>
